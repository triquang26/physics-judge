[project]
name = "kinescore"
version = "0.1.0"
description = "Physics-plausibility benchmark for AI-generated robot video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core stays small on purpose. No diffusers anywhere, not even as an extra:
# the input contract is video files, so any model that can write an mp4 can be
# scored without kinescore knowing anything about how it generates.
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.5,<3",
    "pytorch-kinematics>=0.10,<1",
    "robot-descriptions>=2.0,<3",
]

[project.optional-dependencies]
dino  = ["transformers>=4.55", "huggingface-hub", "safetensors"]
video = ["imageio>=2.37", "imageio-ffmpeg", "opencv-python-headless>=4.8"]
bench = ["pandas", "pyarrow", "scipy", "matplotlib", "tqdm", "pyyaml"]
dev   = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
kinescore = "kinescore.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Default run is CPU-only, network-free and checkpoint-free, and should finish
# in under a minute. Everything that needs a GPU, the network, a trained
# checkpoint or ffmpeg is opt-in via markers.
#
# --cov-fail-under=80: measured 81.51% on 2026-07-30 after adding real unit
# tests for training/calibrate.py (pure tensor math, was 0%), robots/urdf.py
# (pure file parsing, was 54%) and robots/gr1/colliders.py (URDF parsing that
# does not actually need the real ~285 MB GR-1 asset tree despite living in
# an asset-gated package, was 17%) -- none of these needed a GPU, network, or
# $KINESCORE_ASSETS, they were just untested. The remaining gap is
# concentrated in robots/{aloha,airbot_mmk2,gr1}/{fk,spec}.py (20-46%) and
# backbones/dino.py (59%), which genuinely cannot run here: they need either
# $KINESCORE_ASSETS (a local, never-vendored URDF/mesh checkout) or a network
# fetch of pretrained DINO weights, and already have real golden/parity tests
# gated behind that (see e.g. tests/test_fk_golden_aloha_bimanual.py) -- they
# just self-skip on a host without those. 80% is therefore a real, currently
# passing bar (not a permanently-failing one nobody can hit), left unchanged
# rather than lowered.
addopts = "-q -m 'not gpu and not net and not ckpt' --cov=kinescore --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "net: requires network access or a warm HF cache",
    "ckpt: requires a trained checkpoint on disk",
    "ffmpeg: requires the ffprobe/ffmpeg binaries",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Default (false) force-splits every `from X import Y as Z` onto its own
# import statement even when Z is one of several names imported from X --
# e.g. franka/fk.py's 8-name re-export block exploded into 8 statements.
# This repo aliases private re-exports (`X as _X`) routinely, so keep them
# combined like any other multi-name import.
combine-as-imports = true
