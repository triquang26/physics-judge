# kinescore benchmark run config -- the BIMANUAL (ALOHA) run.
#
# SUPERSEDED for aloha_bimanual: `kinescore.robots.available_robots()` now
# includes `"aloha_bimanual"` (the blocker below has landed), so
# `configs/benchmark.yaml` folds this robot into its own `axes.robot`
# directly, with the same iter pins this file uses (re-verified against a
# fresh HF tree crawl at that time). Run that file, not this one, for a
# combined four-robot run. This file is kept as a smaller, single-robot
# worked example and because its `single_view`/multiview commentary (points
# 1-3 below) records detail `configs/benchmark.yaml`'s header only
# summarizes.
#
# NOT wired into any command by default and not exercised against real data
# yet -- it exists to prove the matrix design already supports aloha_bimanual
# without a code change: `configs/robot_map.yaml` already lists it
# (embodiment=bimanual, generators: ctrlworld, dreamgen, dreamdojo), so
# swapping it into `axes.robot` here is the only difference from
# configs/benchmark.yaml.
#
# Blocked on exactly one thing outside this file's scope: an ALOHA robot
# spec + trained reader (the plan's readers work item --
# `src/kinescore/robots/aloha/{spec,fk,constants}.py`, 14 DoF = 2x[6+gripper],
# `limit_semantics="raw_rad"` from the start, `com_margin_m=null` since
# ALOHA has no SUPPORT_POLYGON model -- and a `bimanual.pt` checkpoint
# trained via `kinescore train-rawrad` on the real LeRobot ALOHA data, 30 fps
# per meta/info.json's `robot_type: ALOHA`). Once
# `kinescore.robots.available_robots()` includes `"aloha_bimanual"`, the
# `robots.aloha_bimanual` block below becomes valid (right now
# `kinescore.bench.config._parse_robots` would reject it -- see that
# function's docstring for the bug this validation exists to close) and this
# file runs exactly like configs/benchmark.yaml does today:
# `kinescore bench run --config configs/benchmark_bimanual.yaml`.
#
# The iter pins below were re-verified against the HuggingFace API's file
# tree (the same pass that fixed configs/benchmark.yaml's pins) but NOT
# against a downloaded bimanual tree on disk -- this config is not run, so
# there was nothing local to check them against. Three things worth flagging
# for whoever activates this config:
#
# 1. bimanual's two view-directory spellings hold meaningfully different
#    dreamdojo episode COUNTS, and only one of them is actually usable:
#    `singleview` has iter_000100000 at 150/150 episodes but is entirely
#    pred-only (no `full_gt.mp4` anywhere -- confirmed via a direct HF tree
#    crawl), so `kinescore.bench.sources.dreamdojo.DreamDojoSource`
#    (GT-pairing-strict) would discover zero scored rows from it regardless
#    of iter pin; `single_view` (the underscored spelling -- see
#    kinescore.bench.config.VIEW_DIR_VALUES / kinescore.bench.layout's note
#    on why the two must become separate CELLS during ingestion, never
#    merged) has fewer nominal episodes (103 makovian at iter_000100000, 85
#    non_makovian at iter_000070000 -- DIFFERENT iters per horizon, unlike
#    every other dreamdojo cell in this repo) but DOES have real `full_gt.mp4`
#    pairs for all of them. Fewer-but-pairable beats more-but-unpairable for
#    a benchmark whose whole point is the paired comparison, so
#    `sources.dreamdojo.view_dir` below pins `single_view`, and `iter` is
#    nested per horizon to carry the two different values (see
#    `kinescore.bench.config.SourceConfig`'s ``view_dir``/``iter`` docstrings
#    for the mapping forms this relies on).
# 2. UNLIKE fourier_gr1/franka_panda, aloha_bimanual's dreamgen actually has
#    a populated `output/multiview/dreamgen/{horizon}/iter_XXXXXX/<task>/
#    episode_XXXXXX.mp4` tree (2702 files, genuine iter_*/task/episode
#    nesting) -- the ORIGINAL assumed layout that turned out wrong for the
#    other robots' singleview trees (see kinescore.bench.sources.dreamgen's
#    module docstring). This config still pins `view_dir: singleview` below
#    for consistency, but bimanual might be the one robot where `multiview`
#    is actually the right choice -- worth deciding explicitly, not
#    defaulting to singleview by inertia. na_cells below therefore does NOT
#    blanket-exclude dreamgen x multiview the way configs/benchmark.yaml
#    does for the other three robots.
# 3. The dreamgen iter pinned below, `iter_000110000_bimanual16fps`, matches
#    `configs/data_spec.yaml`'s `**/*bimanual16fps/**` ingestion exclusion
#    glob LITERALLY -- the exact same tension flagged in
#    `kinescore.bench.layout`'s module docstring for `_static16fps`. This
#    SCORING pin (this file) and `kinescore data ingest`'s auto-picked
#    archival iter are independent mechanisms (see
#    `kinescore.bench.layout.RawHFLayout.cells`'s docstring) and can
#    legitimately diverge, but a reader of `cell_card.json` for bimanual
#    dreamgen should not be surprised the ingested iter differs from this one.
#
# ALSO CONFIRMED (universal, checked across every robot x view_dir
# combination including bimanual's): dreamgen's `gt_from: input` finds NO
# ground-truth video anywhere -- input/.../dreamgen/ contains only
# first-frame conditioning PNGs and batch-manifest JSONs for every robot,
# both view_dirs. Every dreamgen cell currently discovers zero scored rows
# regardless of robot. See kinescore.bench.sources.dreamgen's module
# docstring (the `warning::` block) -- this is a design gap in gt-matching,
# not something either benchmark.yaml or this file's iter pins can fix.

run_id: dense_aloha_bimanual
seed: 0

axes:
  robot: [aloha_bimanual]
  view: [multiview, singleview]
  horizon: [makovian, non_makovian]
  cache: [dense]
  generator: [ctrlworld, dreamgen, dreamdojo]

na_cells:
  - {generator: dreamdojo, view: multiview}   # dreamdojo has no multiview tree
  - {generator: ctrlworld, view: singleview}  # ctrlworld has no singleview tree
  # NOT a blanket dreamgen x multiview exclusion -- see point 2 above:
  # bimanual's multiview/dreamgen tree is real, unlike the other robots'.

# No ALOHA checkpoint has been trained yet -- reader is null with
# reader_status: untrained (kinescore.bench.config.RobotConfig), never a
# filename like `bimanual.pt` that does not exist on disk (see
# configs/benchmark.yaml's header comment for the phantom-checkpoint bug
# this schema field exists to prevent).
robots:
  aloha_bimanual:
    spec: aloha_bimanual
    reader: null
    assets: aloha
    reader_status: untrained
    reader_note: "no ALOHA checkpoint has been trained yet"

# iter: bimanual repeats the SAME iter for both horizons (rather than a flat
# top-level string) so the mapping's shape stays uniform --
# SourceConfig.iter's nested form requires every robot's value to be a
# horizon mapping, precisely so a config can never accidentally mix "some
# robots pinned per-horizon, others pinned globally" in one field (see
# kinescore.bench.config.SourceConfig's docstring).
sources:
  dreamgen:
    view_dir: singleview
    gt_from: input
    iter:
      aloha_bimanual:                          # 300/300 episodes, both horizons
        makovian: iter_000110000_bimanual16fps
        non_makovian: iter_000110000_bimanual16fps
  dreamdojo:
    view_dir: single_view  # HAS real full_gt.mp4 pairs; singleview is pred-only -- see point 1 above
    iter:
      aloha_bimanual:
        makovian: iter_000100000      # 103 episodes, HAS gt
        non_makovian: iter_000070000  # 85 episodes, HAS gt
  ctrlworld: {view_dir: multiview}

fps_expected:
  dreamgen: 16.0
  dreamdojo: 10.0

rate_policy: paired
suite: invariant_v1
baseline_cache: dense
caps:
  episodes_per_cell: 150
