# Robot table -- the data-driven answer to "which physical robot generated
# this cell's clips", keyed by kinescore.robots registry name.
#
# `embodiment` is NOT the robot (see kinescore.bench.cell's module
# docstring): it is the coarse on-disk directory the dataset groups clips
# under, and one embodiment can cover more than one robot depending on which
# generator wrote the clip. `humanoid` is the case that motivated this file
# existing at all -- confirmed two ways:
#   * every ctrlworld episode directory under dense/humanoid/output/multiview/
#     ctrlworld/ is literally named `episode_AIRBOT_MMK2_*` /
#     `episode_Airbot_MMK2_*`.
#   * dreamgen/dreamdojo's humanoid clips are Fourier GR-1 (ego-view,
#     confirmed visually against the real reference footage) -- a completely
#     different kinematic tree from Airbot MMK2.
# Scoring GR-1 clips with an Airbot MMK2 reader (or vice versa) would compare
# the wrong robot's joints; this table is what lets `bench.matrix` resolve
# the right one per (embodiment, generator) instead of per embodiment alone.
#
# `generators` lists every generator this robot's clips can come from -- used
# to derive na_cells automatically (a (robot, generator) pair not listed here
# is N/A, not "0 episodes found"; see kinescore.bench.matrix).
#
# This file is read by kinescore.bench.robot_map.load_robot_map and is
# intentionally separate from configs/benchmark.yaml: it describes the
# DATASET's layout (used by `kinescore data ingest`/`verify`, which do not
# need a trained reader), not which robots a particular scoring run has a
# reader for -- see configs/benchmark.yaml's own header for why its
# `axes.robot` is currently a subset of the four robots below.
robots:
  fourier_gr1:
    embodiment: humanoid
    generators: [dreamgen, dreamdojo]
  airbot_mmk2:
    embodiment: humanoid
    generators: [ctrlworld]
  franka_panda:
    embodiment: single_arm
    generators: [ctrlworld, dreamgen, dreamdojo]
  aloha_bimanual:
    embodiment: bimanual
    generators: [ctrlworld, dreamgen, dreamdojo]
