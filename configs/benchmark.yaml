# kinescore benchmark run config -- the reproducibility contract.
#
# Loaded and validated by `kinescore.bench.config.load_config`; see that
# module's docstring for exactly what each field means and how hard/early
# validation works. Expanded into cells by `kinescore.bench.matrix.expand`,
# which ALSO needs `configs/robot_map.yaml` (see `--robot-map` on
# `kinescore bench run`/`kinescore data pull`, default: robot_map.yaml next
# to this file) to resolve each robot's on-disk embodiment directory.
#
# ROBOT, not embodiment, is the primary axis here (`axes.robot`) -- see
# `kinescore.bench.cell`'s module docstring for why: the dataset's
# `embodiment=humanoid` directory covers TWO physically different robots
# depending on generator (Airbot MMK2 for ctrlworld -- episode dirs are
# literally named `episode_AIRBOT_MMK2_*` -- vs Fourier GR-1 for
# dreamgen/dreamdojo), which an embodiment-keyed axis could not express
# without silently mixing the two robots' clips under one label. This run
# covers all four robots in `configs/robot_map.yaml`:
#
#   fourier_gr1    (embodiment=humanoid,    generators: dreamgen, dreamdojo)
#   airbot_mmk2    (embodiment=humanoid,    generators: ctrlworld)
#   franka_panda   (embodiment=single_arm,  generators: ctrlworld, dreamgen, dreamdojo)
#   aloha_bimanual (embodiment=bimanual,    generators: ctrlworld, dreamgen, dreamdojo)
#
# `aloha_bimanual` was deferred in an earlier revision of this file (no ALOHA
# robot spec/reader existed yet). Both now exist
# (`src/kinescore/robots/aloha/{spec,fk,constants}.py`,
# `kinescore.robots.available_robots()` includes `"aloha_bimanual"`), so this
# run folds it in rather than leaving it in the separate
# `configs/benchmark_bimanual.yaml` template that predates the robot landing
# (that file is now superseded by this one for aloha_bimanual; kept around as
# a smaller worked example). Two things worth flagging for whoever runs this:
#
# 1. **None of `dense/bimanual/output/**` is downloaded locally as of this
#    revision** -- only `dense/bimanual/input/` is. The iter pins below were
#    verified against a direct HuggingFace tree crawl (`doanh25032004/
#    video_gen_physics`, `dense/bimanual/output/...`), not (yet) against a
#    local download the way the other three robots' pins were. Adding
#    `aloha_bimanual` here is what makes `kinescore data pull --config
#    configs/benchmark.yaml` derive the right `bimanual/**` patterns; running
#    `kinescore bench run` before pulling will correctly (not spuriously)
#    discover zero clips for these cells -- that is a "not downloaded yet"
#    state, not a declared N/A (see `na_cells` below, which does NOT list
#    aloha_bimanual's real cells) and not a broken pin (see `sources` below
#    for exactly what was measured).
# 2. `dense/bimanual/output` has BOTH a `single_view` (underscore) and a
#    `singleview` subtree for dreamdojo, with DIFFERENT iters and DIFFERENT
#    episode sets -- the exact trap `kinescore.bench.config.VIEW_DIR_VALUES`
#    exists to prevent. A direct HF API crawl (both subtrees, both horizons)
#    found they are NOT interchangeable data, only one is usable:
#
#      single_view/dreamdojo/makovian/iter_000100000       103 episodes  [full_gt.mp4, full_merged.mp4, full_pred.mp4, metrics.json]  HAS GT
#      single_view/dreamdojo/non_makovian/iter_000070000    85 episodes  [full_gt.mp4, full_merged.mp4, full_pred.mp4, metrics.json]  HAS GT
#      singleview/dreamdojo/makovian/iter_000100000        150 episodes  [full_pred.mp4]                                              NO GT
#      singleview/dreamdojo/non_makovian/iter_000100000    150 episodes  [full_pred.mp4]                                              NO GT
#
#    `singleview` has more nominal episodes (150 vs 103/85) but is entirely
#    pred-only -- no `full_gt.mp4` anywhere in it -- so every one of those 150
#    episodes is unpairable and `kinescore.bench.sources.dreamdojo.DreamDojoSource`
#    (GT-pairing-strict, see `kinescore.bench.layout`'s module docstring)
#    would discover zero scored rows from it regardless of iter pin. This
#    benchmark's entire point is the paired real-vs-generated comparison, so
#    fewer-but-pairable beats more-but-unpairable: this file therefore pins
#    `sources.dreamdojo.view_dir` to `single_view` for `aloha_bimanual`
#    specifically (`kinescore.bench.config.SourceConfig`'s `view_dir` mapping
#    form, keyed by robot with a mandatory `default`), while
#    fourier_gr1/franka_panda stay on `singleview` (their own populated,
#    paired tree -- unaffected by this override). The 150-episode
#    `singleview` pred-only variant is a known, deliberately passed-over
#    alternative, not an oversight -- see `sources.dreamdojo` below for the
#    matching per-horizon iter pins (`single_view`'s makovian/non_makovian
#    iters differ, 100000 vs 070000, unlike every other robot's dreamdojo
#    cell).
#
# `airbot_mmk2`'s reader is `airbot_mmk2_rawrad.pt` (raw_rad, val 19.52mm --
# ACCEPTED). Its predecessor `airbot_mmk2.pt` (the legacy squashed-head
# checkpoint) is a real file on disk but `kinescore.readers.load_reader`
# raises `NotImplementedError` on it (see `legacy_docs/PROVENANCE.md`'s D7
# addendum) -- kept out of this config entirely, not referenced anywhere.
#
# `franka_panda`'s only existing raw_rad checkpoint, `single_arm_rawrad.pt`,
# FAILED its acceptance gate: val 162.10mm against a ~19-20mm accepted band
# (fourier_gr1/airbot_mmk2 both land there). That is an order of magnitude
# larger than the very effect this benchmark measures, so naming it as a
# plain `reader:` entry (indistinguishable from an accepted one) would ship
# numbers whose own error dwarfs the signal, silently. It is still named here
# -- the plan wants the raw_rad franka_panda comparison run alongside the
# others, not hidden -- but with `reader_status: failing_gate`, a schema-level
# field (`kinescore.bench.config.RobotConfig.reader_status`, not a comment) a
# downstream reader/tool cannot miss the way a comment can be. No `single_arm.pt`
# (the old squashed-head checkpoint) is referenced anywhere in this file: it
# was deleted (squashed AttentivePoseHead reader, same D7 removal as
# airbot_mmk2's), and re-adding a filename that does not exist on disk is
# exactly the phantom-checkpoint bug this field exists to prevent.
#
# `aloha_bimanual`'s reader does not exist at all yet -- no ALOHA checkpoint
# has been trained -- so `reader: null` with `reader_status: untrained`,
# never a filename (`bimanual.pt` was never a real file; naming it here would
# be the same phantom-path bug the franka_panda paragraph above describes).
# `kinescore.bench.config._parse_robots` enforces `reader is None` whenever
# `reader_status: untrained` is set, so this combination cannot silently
# drift apart again.

run_id: dense_robots_v2
seed: 0

axes:
  robot: [fourier_gr1, airbot_mmk2, franka_panda, aloha_bimanual]
  view: [multiview, singleview]
  horizon: [makovian, non_makovian]
  cache: [dense]
  generator: [ctrlworld, dreamgen, dreamdojo]

# Cells that do not exist on disk -- reported as N/A, never as "0 episodes
# found" (kinescore.bench.matrix.na_cells). A (robot, generator) pair NOT
# claimed by configs/robot_map.yaml (e.g. airbot_mmk2 x dreamgen) is ALREADY
# N/A automatically (kinescore.bench.matrix._is_na checks robot_map first) --
# the rules below are the REMAINING gaps that robot_map cannot express
# because they are about `view`/`horizon`, not which robot/generator pairs
# exist at all. Re-verified directly against the downloaded tree on disk AND
# the HF API's file listing (both agree):
na_cells:
  - {generator: dreamdojo, view: multiview}   # dreamdojo has no multiview tree
  - {generator: ctrlworld, view: singleview}  # ctrlworld has no singleview tree
  # dreamgen also has exactly one view_dir (singleview, pinned below) -- a
  # NEW finding versus an earlier version of this config, which omitted this
  # rule: `output/multiview/dreamgen/` DOES exist on disk for franka_panda
  # (257 episode_XXXXXX.mp4 files directly under {horizon}/, no task or
  # iter_* level -- an incompatible shape the plugin was never designed to
  # read) and does NOT exist at all for fourier_gr1. Without this rule,
  # expand() would still produce a "view=multiview" dreamgen cell (since
  # SourceConfig.view_dir is fixed per generator, not read from cell.view)
  # whose plugin would silently re-glob the SAME singleview directory --
  # discovering every clip twice under two different pair_keys and inflating
  # apparent coverage. Declared N/A instead.
  - {generator: dreamgen, view: multiview}
  # This rule ALSO applies to aloha_bimanual (it has no `robot:` key, so it
  # matches every robot). Worth flagging explicitly: unlike the other three
  # robots (where dreamgen x multiview genuinely has no usable tree),
  # aloha_bimanual's `dense/bimanual/output/multiview/dreamgen/` DOES exist
  # and IS real, paired data (iter_000120000, 150/23 episodes with GT --
  # `full_pred.mp4`/`full_gt.mp4`, a different file-naming shape from every
  # other dreamgen cell in this file, which uses the task_episode
  # `episode_*.mp4` shape with no GT). `sources.dreamgen.view_dir` is one
  # literal value per generator for this whole config (singleview, chosen
  # for consistency with the other three robots), so this real multiview
  # tree is deliberately not reachable here -- a second config would be
  # needed to score it, exactly the same accepted limitation noted for
  # dreamdojo's `single_view` subtree above. Declared N/A via this existing
  # rule rather than a new special case.
  #
  # dreamgen/franka_panda has no non_makovian directory AT ALL under either
  # output/ or input/ -- unlike the two rules above (which drop a whole
  # generator x view slice), this is a THREE-axis gap: dreamgen DOES have a
  # non_makovian tree for fourier_gr1, and franka_panda DOES have a
  # non_makovian tree for ctrlworld/dreamdojo. Pinning any iter here would
  # either fail to resolve (nested iter map below has no franka_panda.
  # non_makovian entry) or -- worse -- silently reuse a wrong one; declaring
  # it N/A is honest.
  - {generator: dreamgen, robot: franka_panda, horizon: non_makovian}

# REPINNED 2026-08-06 onto the DIRECT-KEYPOINT family. Every joint-angle
# (raw_rad / ReadoutV2) checkpoint this block used to name -- `humanoid.pt`,
# `airbot_mmk2_rawrad.pt`, `single_arm_rawrad.pt` -- was deleted from
# $KINESCORE_CKPT_DIR that day, on the decision that direct-keypoint is the
# only reader family kept. What each robot points at now is the one
# direct-keypoint checkpoint that exists for the domain THIS config's cells
# are in: ctrlworld is multiview for airbot/franka/aloha, and fourier_gr1's
# cells here are singleview, so the (robot, domain) keying that made a blind
# repin ambiguous resolves uniquely per robot in this file. A config whose
# cells were in the other domain would need the other checkpoint --
# `robots.<robot>` has one reader slot and no view axis, so that is a schema
# limit to remember, not a bug here.
#
# `load_reader` routes both families off the checkpoint's own cfg
# (`readers/loader.py` checks `is_direct_keypoint_cfg` FIRST). What these
# readers cannot do is the joint-space half of the metric suite:
# `limit_semantics="keypoints"` means `q`/`q_raw` are None by construction,
# so every joint-angle metric reports unavailable-with-a-reason rather than a
# number. The five `kinescore.violations` detectors run off keypoints alone
# and are unaffected -- they are the live scoring path.
#
# val mm below is KEYPOINT error and is NOT comparable to the 19-20mm band
# the deleted raw_rad readers were gated on (different target: 3-D points vs
# joint angles through FK).
#
# The singleview direct-keypoint run does not go through this config at all
# -- see `scripts/score_singleview_direct.py`, which resolves its own cells
# and carries the same iter pins as `sources` below.
robots:
  fourier_gr1:
    spec: fourier_gr1
    reader: fourier_gr1_singleview_kp.pt
    assets: grx
    reader_note: >-
      direct-keypoint, K=12, 1-view, val 45.31mm. The only fourier_gr1
      checkpoint that exists; this config's fourier_gr1 cells are singleview,
      so it is also the right one.
  airbot_mmk2:
    spec: airbot_mmk2
    reader: airbot_mmk2_ctrlworld_kp.pt
    assets: airbot_mmk2
    reader_note: "direct-keypoint, K=12, 3-view, val 11.31mm"
  franka_panda:
    spec: franka_panda
    reader: franka_panda_ctrlworld_kp.pt
    assets: franka
    reader_note: >-
      direct-keypoint, K=8, 3-view, val 23.22mm. Replaces
      `single_arm_rawrad.pt`, whose 162.10mm failing_gate status is now moot
      -- that file was deleted, not re-gated.
  aloha_bimanual:
    spec: aloha_bimanual
    reader: aloha_bimanual_ctrlworld_kp.pt
    assets: aloha
    reader_note: >-
      direct-keypoint, K=18, 3-view, val 23.15mm. No longer untrained -- the
      singleview sibling `aloha_bimanual_singleview_kp.pt` (73.69mm) is the
      one `configs/benchmark_bimanual.yaml` wants instead.

# Per-generator discovery pins. view_dir is the LITERAL on-disk directory
# name -- both "singleview" and "single_view" exist as different directories
# with different episode sets. aloha_bimanual's dreamdojo tree DOES have a
# real, differently-populated "single_view" subtree (see the header comment's
# point 2) -- unlike the other three robots, that IS the one this file needs
# for aloha_bimanual (it is the only one of the two with ground truth), so
# `sources.dreamdojo.view_dir` below is a mapping (`kinescore.bench.config
# .SourceConfig`'s per-robot `view_dir` form) rather than a flat string:
# `default: singleview` for fourier_gr1/franka_panda, `aloha_bimanual:
# single_view` as the one override. The plugin still refuses to glob across
# the two spellings even where they are not overridden -- see
# kinescore.bench.config's VIEW_DIR_VALUES docstring.
#
# iter: a live inventory (see kinescore.bench.sources.dreamgen/dreamdojo's
# docstrings) showed a SINGLE global iter per generator cannot express this
# dataset -- the right iter genuinely differs per (robot, horizon). Every
# fourier_gr1/franka_panda value below was verified two ways: against the
# HuggingFace API's file tree (including per-file LFS content hashes for the
# dreamdojo shape-dedupe question) AND, after `kinescore data pull` finished
# downloading humanoid+single_arm, directly against the tree on disk. Both
# agree exactly:
#
#   dreamgen   fourier_gr1   makovian/non_makovian   iter_000090000              130/130 episodes
#   dreamgen   franka_panda  makovian                iter_000070000             37 episodes**
#   dreamgen   franka_panda  non_makovian             -- N/A, see na_cells above
#   dreamdojo  fourier_gr1   makovian/non_makovian   iter_000050000             776/98 clips*
#   dreamdojo  franka_panda  makovian                iter_000090000             125 episodes
#   dreamdojo  franka_panda  non_makovian             iter_000100000             130 episodes
#
# aloha_bimanual's values below were verified ONE way only, a direct
# HuggingFace tree crawl of `doanh25032004/video_gen_physics`
# (`dense/bimanual/output/...`) -- NOT yet cross-checked against a local
# download (see the header comment's point 1: `dense/bimanual/output/**` is
# not pulled yet). Re-verify against disk once `kinescore data pull` has run:
#
#   dreamgen   aloha_bimanual  makovian/non_makovian   iter_000110000_bimanual16fps  150/150 episodes, NO gt (singleview; see kinescore.bench.sources.dreamgen's gt_from gap below)
#   dreamdojo  aloha_bimanual  makovian                iter_000100000                103 episodes, HAS gt (single_view subtree, see header comment point 2)
#   dreamdojo  aloha_bimanual  non_makovian             iter_000070000                 85 episodes, HAS gt (single_view subtree -- DIFFERENT iter than makovian's, unlike every other robot's dreamdojo cell)
#
# airbot_mmk2 (ctrlworld only) has NO iter_* level at all -- see sources.
# ctrlworld below, which is the same for every robot that uses it.
#
# IMPORTANT, separate from the pins above: dreamgen's `gt_from: input` design
# currently finds ZERO matching ground-truth videos for ANY of the counts
# above -- input/.../dreamgen/ only ever contains first-frame conditioning
# PNGs and batch manifests, never a per-episode ground-truth video, at any
# nesting depth, for any robot (confirmed for aloha_bimanual too, both
# view_dirs -- see configs/benchmark_bimanual.yaml's header). The episode
# counts above are real PREDICTIONS that exist and that the pinned iter
# correctly resolves to; they do not currently become scored manifest ROWS.
# See kinescore.bench.sources.dreamgen's module docstring (the `warning::`
# block) for the full finding -- this is a pre-existing gap in the
# gt-matching design, orthogonal to iter pinning, and intentionally left
# unresolved here rather than papered over with an unverified new
# ground-truth source.
#
# aloha_bimanual's dreamdojo cell does NOT have that "0 scored rows" symptom,
# unlike dreamgen above -- this is exactly why `sources.dreamdojo.view_dir`
# below overrides to `single_view` for aloha_bimanual instead of following
# the other three robots onto `singleview`. `dense/bimanual/output/
# singleview/dreamdojo/{horizon}/iter_000100000/` (the un-overridden
# spelling) has 150/150 `full_pred.mp4` predictions with NO `full_gt.mp4`
# anywhere alongside them (measured via the same HF tree crawl) --
# `kinescore.bench.sources.dreamdojo.DreamDojoSource` is GT-pairing-strict
# (see `kinescore.bench.layout`'s module docstring) and would drop every one
# of those 150 as pred-only, exactly like it already does for dreamdojo's
# pred-only "dir, orphan" shape elsewhere. `single_view` (underscored, fewer
# nominal episodes at 103/85) DOES have real gt -- `full_gt.mp4` alongside
# `full_pred.mp4`, confirmed via the same crawl -- so this file pins that one
# instead: fewer-but-pairable beats more-but-unpairable, and this benchmark's
# entire point is the paired comparison. See the header comment's point 2 for
# the full four-way count table this decision is based on.
#
# * dreamdojo's fourier_gr1/makovian/iter_000050000 packs THREE distinct
#   export shapes into one directory (flat NNNN_pred/gt.mp4, 658 episodes; a
#   "dir" shape episode_<id>/full_pred+gt.mp4, 118 episodes; and a pred-only
#   "dir" orphan shape with no ground truth anywhere, dropped). Confirmed via
#   LFS sha256 comparison that flat and dir are NOT duplicates of each other
#   (only ~1-4% accidental hash matches) -- see
#   kinescore.bench.sources.dreamdojo's module docstring for the full
#   investigation and kinescore.bench.sources.dreamdojo.DreamDojoSource for
#   how both are discovered with disambiguated, non-colliding pair_keys
#   (`flat:NNNN` vs `dir:NNNN`). 658 + 118 = 776.
#
# ** dreamgen/franka_panda/makovian was previously pinned to
#    iter_000090000_static16fps, which the cell reported as "1 episode" even
#    though 120 episode_*.mp4 files genuinely exist under that iter -- they
#    live one level deeper than every other dreamgen iter, nested inside a
#    `global/` subdirectory (`.../iter_000090000_static16fps/global/
#    episode_NNNNNN.mp4`), a layout this plugin's flat, non-recursive glob
#    does not descend into, so it found 0 of the 120. `iter_000070000`
#    (same makovian horizon) has its 37 episode_*.mp4 files flat directly
#    under the iter directory, the shape the plugin expects, and is used
#    instead -- fewer-but-discoverable beats more-but-invisible, same
#    reasoning as the dreamdojo view_dir override above. Re-verified
#    directly against disk (`find ... -maxdepth 1 -name '*.mp4'`):
#    iter_000070000 → 37, iter_000090000_static16fps (maxdepth 1) → 0.
#
# dreamdojo/franka_panda was previously pinned to iter_000030000 for BOTH
# horizons (120/120 episodes each) -- a real, dereferenceable directory, but
# not the largest populated one for either horizon. Re-verified directly
# against disk: iter_000090000 holds 125 makovian episodes (vs 120 at
# iter_000030000) and iter_000100000 holds 130 non_makovian episodes (vs 120
# at iter_000030000); both are now pinned per-horizon below, matching the
# per-horizon pinning already used for aloha_bimanual's dreamdojo cell.
#
# dreamgen's plugin (kinescore.bench.sources.dreamgen) additionally pins the
# horizon segment to exactly {makovian, non_makovian} and skips any
# "_"-prefixed directory it encounters while globbing tasks/episodes -- both
# guards exist specifically because of two confirmed franka_panda layout
# quirks: view-named siblings of the horizon dirs under
# dense/single_arm/input/singleview/dreamgen/ (exterior_1_left,
# exterior_2_left, global), and a non-episode _fps_compare directory under
# dense/single_arm/output/singleview/dreamgen/. See that plugin's docstring.
sources:
  dreamgen:
    view_dir: singleview
    gt_from: input
    iter:
      fourier_gr1:
        makovian: iter_000090000
        non_makovian: iter_000090000
      franka_panda:
        makovian: iter_000070000
        # non_makovian: declared N/A above -- no entry here on purpose.
      aloha_bimanual:
        makovian: iter_000110000_bimanual16fps
        non_makovian: iter_000110000_bimanual16fps
  dreamdojo:
    # default applies to fourier_gr1/franka_panda; aloha_bimanual overrides
    # to the underscored spelling -- see the header comment's point 2 and
    # the "Per-generator discovery pins" comment above for the full
    # GT-pairing evidence this override is based on.
    view_dir: {default: singleview, aloha_bimanual: single_view}
    iter:
      fourier_gr1:
        makovian: iter_000050000
        non_makovian: iter_000050000
      franka_panda:
        # Per-horizon, not a shared iter -- see the "**"/dreamdojo correction
        # note above: iter_000090000 (125 episodes) and iter_000100000 (130
        # episodes) are each larger than the previously-pinned
        # iter_000030000 (120/120).
        makovian: iter_000090000
        non_makovian: iter_000100000
      aloha_bimanual:
        # single_view's two horizons live under DIFFERENT iters (unlike
        # every other robot's dreamdojo cell, where both horizons share
        # one iter) -- 103 episodes at iter_000100000 (makovian), 85 at
        # iter_000070000 (non_makovian), both with real full_gt.mp4 pairs.
        makovian: iter_000100000
        non_makovian: iter_000070000
  ctrlworld: {view_dir: multiview}

# Cross-checked against ffprobe at manifest time (kinescore.video.probe.
# resolve_timebase); disagreement beyond tolerance is a hard error, not a
# silent override in either direction. ctrlworld has NO table entry here on
# purpose -- fps is not constant even within one ctrlworld cell (a probed
# sample had 2 episodes at 30fps against 394 at 5fps), so the probed rate is
# always trusted outright rather than compared against a single number that
# would be wrong for a real minority of clips. See
# kinescore.bench.sources.ctrlworld's docstring.
# Cross-check only: resolve_timebase raises if this disagrees with ffprobe,
# in either direction. It can fail a run; it can never override a measurement.
# Nested per ROBOT (not embodiment) because ONE generator emits different
# rates for different robots -- dreamdojo is 10 fps for fourier_gr1 but
# 15 fps for franka_panda. A flat table silently emptied all 480
# franka_panda/dreamdojo episodes in an earlier version of this config (the
# D3 guard doing its job against a wrong config).
fps_expected:
  dreamgen: 16.0
  dreamdojo:
    fourier_gr1: 10.0
    franka_panda: 15.0

rate_policy: paired
suite: all_metrics
baseline_cache: dense
caps:
  episodes_per_cell: 150
