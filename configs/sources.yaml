# `kinescore pull` reads only this file.
#
# `include` is a whitelist. vgp_datasets also ships twelve `*_dreamgen*`
# directories in {metas, t5_xxl, videos} shape: those train the video
# generators, carry no robot state, and cannot supervise a keypoint head.

sources:
  bench:
    repo: doanh25032004/video_gen_physics
    include: ["data_for_web/*"]
    strip_prefix: data_for_web
    dest: bench

  train:
    repo: doanh25032004/vgp_datasets
    include: ["bimanual/*", "humanoid/*"]
    dest: corpus

  # Generated clips outside data_for_web. Lands under bench/fastercache, the
  # same <method>/<embodiment>/output/<view> shape as the manifest trees; the
  # manifest does not cover it, so scoring points --videos at it.
  fastercache:
    repo: doanh25032004/video_gen_physics
    include: ["fastercache/humanoid/output/singleview/*",
              "fastercache/humanoid/output/multiview/*"]
    dest: bench

  cosmos:
    repo: doanh25032004/cosmos_synthetic_data
    include: ["high/*", "low/*"]
    dest: bench/cosmos

  # Radial single-arm clips, same shape as fastercache; the manifest does not
  # cover them, so scoring points --videos at bench/radial.
  radial:
    repo: doanh25032004/video_gen_physics
    include: ["radial/single_arm/output/singleview/*",
              "radial/single_arm/output/multiview/*",
              "radial/bimanual/output/singleview/*"]
    dest: bench

  dense:
    repo: doanh25032004/video_gen_physics
    include: ["dense/single_arm/output/singleview/*"]
    dest: bench

  # The remaining generators, one entry each. Every one ships the same
  # dreamgen/makovian branch for all three embodiments, so a cell can score any
  # of them against the reader its embodiment already has.
  itm:
    repo: doanh25032004/video_gen_physics
    include: ["itm/humanoid/output/singleview/dreamgen/makovian/**",
              "itm/bimanual/output/singleview/dreamgen/makovian/**",
              "itm/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

  sito:
    repo: doanh25032004/video_gen_physics
    include: ["sito/humanoid/output/singleview/dreamgen/makovian/**",
              "sito/bimanual/output/singleview/dreamgen/makovian/**",
              "sito/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

  dicache:
    repo: doanh25032004/video_gen_physics
    include: ["dicache/humanoid/output/singleview/dreamgen/makovian/**",
              "dicache/bimanual/output/singleview/dreamgen/makovian/**",
              "dicache/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

  pisa:
    repo: doanh25032004/video_gen_physics
    include: ["pisa/humanoid/output/singleview/dreamgen/makovian/**",
              "pisa/bimanual/output/singleview/dreamgen/makovian/**",
              "pisa/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

  svg1:
    repo: doanh25032004/video_gen_physics
    include: ["svg1/humanoid/output/singleview/dreamgen/makovian/**",
              "svg1/bimanual/output/singleview/dreamgen/makovian/**",
              "svg1/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

  svg2:
    repo: doanh25032004/video_gen_physics
    include: ["svg2/humanoid/output/singleview/dreamgen/makovian/**",
              "svg2/bimanual/output/singleview/dreamgen/makovian/**",
              "svg2/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

  worldcache:
    repo: doanh25032004/video_gen_physics
    include: ["worldcache/humanoid/output/singleview/dreamgen/makovian/**",
              "worldcache/bimanual/output/singleview/dreamgen/makovian/**",
              "worldcache/single_arm/output/singleview/dreamgen/makovian/**"]
    dest: bench/methods

